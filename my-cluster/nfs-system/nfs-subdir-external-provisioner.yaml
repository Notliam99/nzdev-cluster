apiVersion: v1
kind: Namespace
metadata:
  name: nfs-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nfs-subdir-external-provisioner-repo
  namespace: nfs-system
spec:
  interval: 1h0m0s
  url: https://kubernetes-sigs.github.io/nfs-subdir-external-provisioner
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nfs-subdir-external-provisioner-release
  namespace: nfs-system
spec:
  chart:
    spec:
      chart: nfs-subdir-external-provisioner
      sourceRef:
        kind: HelmRepository
        name: nfs-subdir-external-provisioner-repo
      version: 4.0.18
  values:
    nfs:
      server: 192.168.50.3
      path: /mnt/tank/nfs/kubernetes
    storageClass:
      create: true
      defaultClass: true
      name: nfsclient
  interval: 1h0m0s
