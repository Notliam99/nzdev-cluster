apiVersion: v1
kind: Namespace
metadata:
  name: bitwarden
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: github-bitwarden-token
  namespace: bitwarden
spec:
  encryptedData:
    bearerToken: 
  template:
    metadata:
      creationTimestamp: null
      name: github-bitwarden-token
      namespace: bitwarden
    type: Opaque
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: bitwarden
  namespace: bitwarden
spec:
  url: https://github.com/Notliam99/bitwarden-manifests.git
  interval: 2h
  secretRef:
    name: github-bitwarden-token
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bitwarden
  namespace: bitwarden
spec:
  interval: 1h
  prune: true
  sourceRef:
    kind: GitRepository
    name: bitwarden
  path: .
