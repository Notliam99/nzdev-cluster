apiVersion: v1
kind: Namespace
metadata:
  name: fishy-site
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: fishy-gh-token
  namespace: fishy-site
spec:
  encryptedData:
    identity: 
    known_hosts: 
  template:
    metadata:
      creationTimestamp: null
      name: fishy-gh-token
      namespace: fishy-site
    type: Opaque
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: fish-site
  namespace: fishy-site
spec:
  url: ssh://git@github.com:HowManyFish/FishySite.git
  interval: 5m
  secretRef:
    name: fishy-gh-token
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fishy-site
  namespace: fishy-site
spec:
  interval: 10m
  prune: true
  sourceRef:
    kind: GitRepository
    name: nzdev-org-homepage
  path: ./deploy
