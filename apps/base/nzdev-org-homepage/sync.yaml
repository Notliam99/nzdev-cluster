apiVersion: v1
kind: Namespace
metadata:
  name: nzdev-org-homepage
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: nzdev-org-homepage
  namespace: nzdev-org-homepage
spec:
  url: https://github.com/Notliam99/nzdev-org.git
  interval: 15m
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nzdev-org-homepage
  namespace: nzdev-org-homepage
spec:
  interval: 15m
  prune: true
  sourceRef:
    kind: GitRepository
    name: nzdev-org-homepage
  path: ./deploy
