apiVersion: v1
kind: Namespace
metadata:
  name: nzdev-org-homepage
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  creationTimestamp: null
  name: homepage-github-token
  namespace: nzdev-org-homepage
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      creationTimestamp: null
      name: homepage-github-token
      namespace: nzdev-org-homepage
    type: Opaque
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: nzdev-org-homepage
  namespace: nzdev-org-homepage
spec:
  url: https://github.com/Notliam99/nzdev-org.git
  interval: 12h
  # secretRef:
  #   name: homepage-github-token
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nzdev-org-homepage
  namespace: nzdev-org-homepage
spec:
  interval: 12h
  prune: true
  sourceRef:
    kind: GitRepository
    name: nzdev-org-homepage
  path: ./deploy
