---
apiVersion: v1
kind: Namespace
metadata:
  name: reflector
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: reflector
  namespace: reflector
spec:
  interval: 24h
  url: https://emberstack.github.io/helm-charts
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector
spec:
  interval: 30m
  chart:
    spec:
      spec:
        chart: reflector
        version: "v9.1.25"
        sourceRef:
          kind: HelmRepository
          name: reflector
          namespace: reflector
        interval: 12h
